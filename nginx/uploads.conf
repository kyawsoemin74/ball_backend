location ^~ /uploads/news/ {
    alias /var/www/fover/uploads/news/;
    autoindex off;
    expires 30d;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    limit_except GET HEAD {
        deny all;
    }
}

location /uploads/ {
    alias /var/www/fover/uploads/;
    autoindex off;
    expires 30d;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    limit_except GET HEAD {
        deny all;
    }
}
