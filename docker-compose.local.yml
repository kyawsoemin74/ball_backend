services:
  api:
    environment:
      NEWS_UPLOAD_DIR: /var/www/fover/uploads/news
      NEWS_UPLOAD_PUBLIC_URL: "http://${LOCAL_PUBLIC_HOST:-localhost}:${LOCAL_NGINX_PORT:-8081}/uploads/news/"
    volumes:
      - news_uploads:/var/www/fover/uploads

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${LOCAL_NGINX_PORT:-8081}:80"
    volumes:
      - news_uploads:/var/www/fover/uploads:ro
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/uploads.conf:/etc/nginx/uploads.conf:ro

volumes:
  news_uploads:
